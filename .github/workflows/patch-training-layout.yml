name: Patch Training Layout (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-training-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restructure Training section in index.html
        run: |
          python3 - <<'PY'
          import pathlib
          import sys
          p = pathlib.Path("index.html")
          html = p.read_text(encoding="utf-8")
          def fail(msg):
              print("ASSERT FAILED: " + msg, file=sys.stderr)
              sys.exit(1)
          def matching_close(s, start):
              depth = 0
              i = start
              while True:
                  o = s.find("<div", i)
                  c = s.find("</div>", i)
                  if c == -1:
                      fail("no matching </div>")
                  if o != -1 and o < c:
                      depth += 1
                      i = o + 4
                  else:
                      depth -= 1
                      i = c + 6
                      if depth == 0:
                          return i
          if html.count("data-sss-training-log") != 1:
              fail("data-sss-training-log count is not 1")
          if html.count("Start Training on TrainHeroic") != 3:
              fail("Start Training count is not 3")
          if "$30" not in html or "$15" not in html:
              fail("prices missing")
          if html.count("SSS TRAINING LOG") != 1:
              fail("SSS TRAINING LOG count is not 1")
          if html.count("</style>") != 1:
              fail("</style> count is not 1")
          sec_start = html.find('<section class="block" id="training">')
          if sec_start == -1:
              fail("training section opening not found")
          sec_end = html.find("</section>", sec_start)
          if sec_end == -1:
              fail("training section closing not found")
          section = html[sec_start:sec_end]
          if section.count('<div class="offer-card">') != 1:
              fail("offer-card count in training section is not 1")
          if section.count("<figure") != 1:
              fail("figure count in training section is not 1")
          if section.count('<div class="steps-head">') != 1:
              fail("steps-head count is not 1")
          if section.count("<article data-sss-training-log") != 1:
              fail("log article count is not 1")
          offer_start = section.find('<div class="offer-card">')
          offer_end = matching_close(section, offer_start)
          figure_start = section.find("<figure")
          figure_end = section.find("</figure>", figure_start) + len("</figure>")
          steps_start = section.find('<div class="steps-head">')
          log_start = section.find("<article data-sss-training-log")
          log_end = section.find("</article>", log_start) + len("</article>")
          if not (offer_start < steps_start < log_start):
              fail("block order is not offer, steps, log")
          if not (figure_start < steps_start):
              fail("figure is not before steps")
          offer_card = section[offer_start:offer_end]
          figure = section[figure_start:figure_end]
          log_block = section[log_start:log_end]
          if "SSS COMPLETE" not in offer_card:
              fail("COMPLETE card missing SSS COMPLETE")
          if "$30" not in offer_card:
              fail("COMPLETE card missing $30")
          if "sss-complete" not in offer_card:
              fail("COMPLETE card missing sss-complete link")
          if "255 lb clean" not in figure:
              fail("figure missing 255 lb clean")
          if "<video" not in figure:
              fail("figure missing video")
          pitch = "My own training, posted as I train it. Follow along and log every session in the app."
          if pitch not in log_block:
              fail("log block missing pitch line")
          if "sss-training-log" not in log_block:
              fail("log block missing sss-training-log link")
          if "$15" not in log_block:
              fail("log block missing $15")
          split_start = section.find('<div class="split">')
          if split_start != -1:
              header = section[:split_start]
              middle_start = matching_close(section, split_start)
          else:
              header = section[:min(figure_start, offer_start)]
              middle_start = max(figure_end, offer_end)
          if "Your whole week of training, already written" not in header:
              fail("training header missing")
          middle = section[middle_start:log_start]
          if "steps-head" not in middle or "Join, train, get stronger" not in middle:
              fail("steps block not in middle")
          tail = section[log_end:]
          fig_open_end = figure.find(">")
          fig_open = figure[:fig_open_end]
          if 'class="media"' in fig_open:
              fig_open_new = fig_open.replace('class="media"', 'class="media training-media-wide"', 1)
          else:
              fig_open_new = fig_open + ' class="training-media-wide"'
          figure_wide = fig_open_new + figure[fig_open_end:]
          new_log = (
              '<article data-sss-training-log="1" class="offer-card offer-card-log">\n'
              '<span class="offer-badge">7 Days Free</span>\n'
              '<p class="offer-name">SSS TRAINING LOG \u00b7 TrainHeroic</p>\n'
              '<p class="offer-price">$15<span>/mo</span></p>\n'
              '<p class="offer-sub">My own training, posted as I train it. Follow along and log every session in the app.</p>\n'
              '<ul class="included">\n'
              '<li>Every session I train, posted in the app</li>\n'
              '<li>Log your own sets alongside mine</li>\n'
              '<li>New sessions added as I train them</li>\n'
              '</ul>\n'
              '<a class="btn btn-red" href="https://marketplace.trainheroic.com/workout-plan/team/sss-training-log">Follow Along on TrainHeroic</a>\n'
              '</article>'
          )
          new_section = (
              header
              + '<div class="offers-grid">\n'
              + offer_card + '\n'
              + new_log + '\n'
              + '</div>\n'
              + figure_wide + '\n'
              + middle
              + tail
          )
          css = (
              '\n/* Training offers row: two cards side by side on wide screens */\n'
              '.offers-grid{display:grid;grid-template-columns:1fr;gap:24px;margin-top:24px}\n'
              '@media (min-width:860px){.offers-grid{grid-template-columns:1.12fr .88fr}}\n'
              '.offers-grid .offer-card{height:100%}\n'
              '.offer-card-log{display:flex;flex-direction:column}\n'
              '.offer-card-log .btn{margin-top:auto}\n'
              '.training-media-wide{margin-top:28px;width:100%}\n'
              '.training-media-wide video{height:auto}\n'
          )
          new_html = html[:sec_start] + new_section + html[sec_end:]
          new_html = new_html.replace("</style>", css + "</style>", 1)
          if new_html.count("data-sss-training-log") != 1:
              fail("after: data-sss-training-log count is not 1")
          if new_html.count("Start Training on TrainHeroic") != 3:
              fail("after: Start Training count is not 3")
          if new_html.count("SSS TRAINING LOG") != 1:
              fail("after: SSS TRAINING LOG count is not 1")
          if "$30" not in new_html or "$15" not in new_html:
              fail("after: prices missing")
          if "offers-grid" not in new_html or "offer-card-log" not in new_html or "training-media-wide" not in new_html:
              fail("after: new classes missing")
          if '<div class="split">' in new_section:
              fail("after: old split still in training section")
          if "posts.json" not in new_html or "books.json" not in new_html:
              fail("after: loaders missing")
          if "netlify-identity" not in new_html:
              fail("after: Netlify Identity wiring missing")
          if offer_card not in new_html:
              fail("after: COMPLETE card changed")
          if middle not in new_html:
              fail("after: steps block changed")
          if figure_wide not in new_html:
              fail("after: video figure missing")
          if new_section.find("training-media-wide") < new_section.find("offer-card-log"):
              fail("after: video figure is not below the offers row")
          p.write_text(new_html, encoding="utf-8")
          print("Training section restructured OK")
          PY
      - name: Commit and push index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Restructure Training section: two-column offers row, log card beside SSS COMPLETE, clean video below"
            git push
          fi
