name: Patch audit fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Apply audit fixes to index.html
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          original = text

          replacements = [
              (
                  '<meta property="og:url" content="https://strengthspeedsteve.com" />',
                  '<meta property="og:url" content="https://strengthspeedsteve.com" />\n'
                  '<meta property="og:image" content="https://strengthspeedsteve.com/og-image.jpg" />\n'
                  '<meta property="og:image:width" content="1200" />\n'
                  '<meta property="og:image:height" content="630" />\n'
                  '<meta name="twitter:card" content="summary_large_image" />\n'
                  '<meta name="twitter:title" content="SSS COMPLETE — Start 7 Days Free on TrainHeroic" />\n'
                  '<meta name="twitter:description" content="Get stronger and faster with a real plan. SSS COMPLETE on TrainHeroic — 7-day free trial, then $30/mo." />\n'
                  '<meta name="twitter:image" content="https://strengthspeedsteve.com/og-image.jpg" />',
              ),
              (
                  '<a class="brand" href="#top" aria-label="Strength Speed Steve — home">',
                  '<a class="brand" href="#top" aria-label="Strength Speed Steve — home">\n'
                  '      <img class="brand-logo" src="/apple-touch-icon.png" alt="" width="42" height="42" />',
              ),
              (
                  '.brand{text-decoration:none;color:#fff;line-height:1.1}',
                  '.brand{text-decoration:none;color:#fff;line-height:1.1;position:relative;padding-left:54px}.brand-logo{position:absolute;left:0;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%}',
              ),
              (
                  'function renderPosts(){\n'
                  '    var grid = document.getElementById("postGrid");\n'
                  '    if(!grid) return;',
                  'function renderPosts(){\n'
                  '    var grid = document.getElementById("postGrid");\n'
                  '    if(!grid) return;\n'
                  '    var hasPosts = Object.keys(ARTICLES).length > 0;\n'
                  '    var blogSec = document.getElementById("blog");\n'
                  '    if(blogSec) blogSec.style.display = hasPosts ? "" : "none";\n'
                  '    document.querySelectorAll(\'a[href="#blog"]\').forEach(function(n){ n.style.display = hasPosts ? "" : "none"; });',
              ),
          ]

          for i, (old, new) in enumerate(replacements, start=1):
              count = text.count(old)
              if count != 1:
                  print(f"ERROR: replacement {i}: old string occurs {count} times, expected exactly 1; aborting without writing anything", file=sys.stderr)
                  sys.exit(1)
              text = text.replace(old, new)

          if text == original:
              print("ERROR: no changes made", file=sys.stderr)
              sys.exit(1)

          path.write_text(text, encoding="utf-8")
          print("All 4 replacements applied exactly once; index.html updated.")
          PY
      - name: Commit updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply audit fixes: og/twitter share tags, header logo, auto-hide empty Blog"
          git push
