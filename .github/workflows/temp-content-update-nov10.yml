name: Temp content update Nov 10
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe file structure 3
        run: |
          python3 - <<'PY'
          import pathlib, re
          s = pathlib.Path("index.html").read_text(encoding="utf-8")
          for m in re.finditer(r"ARTICLES\s*=", s):
              print("ARTICLES_ASSIGN at", m.start(), repr(s[max(0, m.start()-120):m.start()+200]))
          print("ARTICLES count", len(list(re.finditer(r"ARTICLES", s))))
          print("title counts:", s.count("Welcome to Strength Speed Steve"), s.count("Speed Training 101"))
          k = s.find("var BOOKS")
          print("var BOOKS exact:", repr(s[k:k+220]))
          i = s.find("renderBooks();")
          print("books fetch area:", repr(s[i:i+800]))
          print("PROBE3_DONE")
          PY
      - name: Commit patch
        run: |
          git config user.name "steven-rose34"
          git config user.email "steven-rose34@users.noreply.github.com"
          git add index.html posts.json books.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Apply content updates: hero, checklist, log pitch, steps, about; remove blog posts; add 33 books"
          git push
