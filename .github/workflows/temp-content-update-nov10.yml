name: Temp content update Nov 10
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe file structure 2
        run: |
          python3 - <<'PY'
          import pathlib, re
          s = pathlib.Path("index.html").read_text(encoding="utf-8")
          i = s.find("function renderPosts")
          print("renderPosts at", i)
          print(repr(s[i:i+3500]))
          j = s.find("var BOOKS")
          print("var BOOKS at", j)
          print(repr(s[j:j+600]))
          print("POSTS tokens:", len(list(re.finditer(r"POSTS", s))))
          for m in list(re.finditer(r"POSTS", s))[:10]:
              print("  ", repr(s[max(0, m.start()-60):m.end()+80]))
          print("fetch calls:")
          for m in re.finditer(r"fetch\(", s):
              print("  ", repr(s[max(0, m.start()-60):m.end()+120]))
          print("PROBE2_DONE")
          PY
      - name: Commit patch
        run: |
          git config user.name "steven-rose34"
          git config user.email "steven-rose34@users.noreply.github.com"
          git add index.html posts.json books.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Apply content updates: hero, checklist, log pitch, steps, about; remove blog posts; add 33 books"
          git push
