name: Temp fix photos and books Nov 10
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch photos and books
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          html_p = pathlib.Path("index.html")
          books_p = pathlib.Path("books.json")
          posts_p = pathlib.Path("posts.json")
          assert html_p.exists(), "index.html missing - refusing to proceed"
          assert books_p.exists(), "books.json missing - refusing to proceed"
          assert posts_p.exists(), "posts.json missing - refusing to proceed"
          s = html_p.read_text(encoding="utf-8")
          books_txt = books_p.read_text(encoding="utf-8")

          BOOKS_33 = [
              ("How to Win Friends and Influence People", "Dale Carnegie"),
              ("Confessions of an Economic Hit Man (3rd Edition)", "John Perkins"),
              ("Never Split the Difference", "Chris Voss"),
              ("The Fourth Turning", "William Strauss & Neil Howe"),
              ("The Fourth Turning Is Here", "Neil Howe"),
              ("The Intelligent Investor", "Benjamin Graham"),
              ("The Sovereign Individual", "James Dale Davidson & William Rees-Mogg"),
              ("Do Hard Things", "Steve Magness"),
              ("Spark", "John J. Ratey"),
              ("Broken Money", "Lyn Alden"),
              ("The Other Wes Moore", "Wes Moore"),
              ("Basic Economics (5th Edition)", "Thomas Sowell"),
              ("The Richest Man in Babylon", "George S. Clason"),
              ("1984", "George Orwell"),
              ("Animal Farm", "George Orwell"),
              ("Think Big and Kick Ass in Business and Life", "Donald J. Trump & Bill Zanker"),
              ("The 4-Hour Workweek", "Timothy Ferriss"),
              ("Outlive", "Peter Attia"),
              ("Can't Hurt Me", "David Goggins"),
              ("Never Finished", "David Goggins"),
              ("Conscious Coaching", "Brett Bartholomew"),
              ("12 Rules for Life", "Jordan B. Peterson"),
              ("Dopamine Nation", "Anna Lembke"),
              ("Chop Wood Carry Water", "Joshua Medcalf"),
              ("Alone at Dawn", "Dan Schilling"),
              ("The Story of Civilization I", "Will Durant"),
              ("The Story of Civilization II", "Will Durant"),
              ("The Story of Civilization III", "Will Durant"),
              ("The Story of Civilization IV", "Will Durant"),
              ("The Psychology of Money", "Morgan Housel"),
              ("Cancel Me If You Can", "Dave Portnoy"),
              ("Elon Musk", "Walter Isaacson"),
              ("Endurance", "Alfred Lansing"),
          ]
          assert len(BOOKS_33) == 33, "seed book list must have exactly 33 entries"
          SEED = [{"title": t, "author": a, "note": ""} for t, a in BOOKS_33]

          def check(text, sub, n, label):
              c = text.count(sub)
              assert c == n, f"{label}: expected {n}, found {c}"

          def find_book_marker(text):
              found = []
              for pat in (r"var BOOKS\s*=", r"const FALLBACK_BOOKS\s*="):
                  for m in re.finditer(pat, text):
                      found.append(m)
              assert len(found) == 1, f"embedded book array marker must appear exactly once, found {len(found)}"
              return found[0].start()

          def parse_book_array(text, marker_idx):
              start = text.find("[", marker_idx)
              assert start >= 0, "book array open bracket not found"
              depth = 0
              in_str = False
              esc = False
              i = start
              while i < len(text):
                  ch = text[i]
                  if in_str:
                      if esc:
                          esc = False
                      elif ch == "\\":
                          esc = True
                      elif ch == '"':
                          in_str = False
                  else:
                      if ch == '"':
                          in_str = True
                      elif ch == "[":
                          depth += 1
                      elif ch == "]":
                          depth -= 1
                          if depth == 0:
                              raw = text[start:i + 1]
                              clean = re.sub(r"/\*.*?\*/", "", raw, flags=re.S)
                              lines = [ln for ln in clean.splitlines() if not ln.strip().startswith("//")]
                              return json.loads("\n".join(lines)), start, i + 1
                  i += 1
              raise AssertionError("book array end not found")

          def books_section_of(text):
              m = re.search(r'<section[^>]*\bid="books"[^>]*>.*?</section>', text, flags=re.S)
              assert m, "books section not found"
              return m.group(0)

          def books_view_of(text):
              m = re.search(r'<section[^>]*\bid="books-view"[^>]*>.*?</section>', text, flags=re.S)
              assert m, "books view section not found"
              return m.group(0)

          check(s, "Start Training on TrainHeroic", 3, "TrainHeroic buttons")
          assert "$30" in s and "$15" in s, "expected prices missing"
          assert "identity.netlify.com" in s and "netlifyIdentity" in s, "Netlify Identity wiring missing"
          assert "</html>" in s, "closing html tag missing"
          check(s, "<figure", 3, "homepage figures")
          check(s, "<figcaption>405 lb back squat</figcaption>", 1, "hero caption")
          check(s, "<figcaption>255 lb clean</figcaption>", 1, "training banner caption")
          check(s, "<figcaption>185 lb snatch</figcaption>", 1, "about caption")
          check(s, 'class="hero-photo"', 1, "hero figure class")
          check(s, 'class="media training-media-wide"', 1, "training banner figure class")
          check(s, 'class="media"', 1, "about figure class")
          assert s.count("Steve's bookshelf") in (1, 2), "books heading count unexpected"
          assert "Books Steve recommends" in s, "books intro missing"
          assert "Welcome to Strength Speed Steve" in s, "first blog post missing"
          assert "Speed Training 101" in s, "second blog post missing"
          assert 'fetch("posts.json"' in s, "blog loader missing"
          assert 'fetch("books.json"' in s, "book loader missing"
          check(s, 'id="books"', 1, "books section id")
          check(s, 'id="bookGrid"', 1, "book grid container")
          check(s, 'id="bookEmpty"', 1, "book empty container")

          embedded, _es, _ee = parse_book_array(s, find_book_marker(s))
          assert isinstance(embedded, list), "embedded books must be a list"
          for b in embedded:
              assert isinstance(b, dict) and b.get("title") and b.get("author"), "book entries must be objects with title and author"
          assert len(embedded) in (0, 33), f"embedded books: expected 0 or 33, found {len(embedded)}"
          books_data = json.loads(books_txt)
          assert isinstance(books_data, dict) and isinstance(books_data.get("books"), list), "books.json must be an object with a books list"
          json_books = books_data["books"]
          for b in json_books:
              assert isinstance(b, dict) and b.get("title") and b.get("author"), "books.json entries must be objects with title and author"
          assert len(json_books) in (0, 33), f"books.json: expected 0 or 33, found {len(json_books)}"
          if len(embedded) == 33 and len(json_books) == 33:
              assert [(b["title"], b["author"]) for b in embedded] == [(b["title"], b["author"]) for b in json_books], "embedded and books.json book lists disagree"
              canonical = embedded
              print("book data already has 33 entries on both sides; using them")
          elif len(embedded) == 33:
              canonical = embedded
              print("books.json empty: syncing it from the embedded list")
          elif len(json_books) == 33:
              canonical = json_books
              print("embedded book list empty: syncing it from books.json")
          else:
              canonical = SEED
              print("SEED: book data empty in both index.html and books.json; seeding the canonical 33 books")
          for b in canonical:
              assert b.get("title") and b.get("author"), "every book needs a title and an author"
          assert len({b["title"] for b in canonical}) == 33, "book titles must be unique"
          assert len(canonical) == 33, "canonical book list must have exactly 33 entries"
          canonical = [{"title": b["title"], "author": b["author"], "note": b.get("note", "")} for b in canonical]
          home0 = books_section_of(s)
          for b in canonical:
              assert b["title"] not in home0, "book title in the homepage books section before patch: " + b["title"]
          books_out = json.dumps({"books": canonical}, indent=2) + "\n"

          s2 = s
          _emb, a_start, a_end = parse_book_array(s2, find_book_marker(s2))
          new_arr = "[\n" + ",\n".join("  " + json.dumps(b) for b in canonical) + "\n]"
          s2 = s2[:a_start] + new_arr + s2[a_end:]

          assert s2.count("</style>") == 1, "expected exactly one </style>"
          CSS_FIX = """
            /* Figure centering fix (Nov 10): every homepage photo/video figure is centered in its container at desktop and mobile widths, and each caption is centered under its media. */
            figure.hero-photo, figure.media{margin-inline:auto;width:100%;max-width:100%}
            figure.hero-photo figcaption, figure.media figcaption{text-align:center}
            /* Books view (Nov 10): a dedicated full-page view for the complete bookshelf. */
            #books-view{display:none}
            body.books-open #books-view{display:block}
            body.books-open main>section:not(#books-view){display:none}
            body.books-open footer{display:none}
            .books-back{margin-bottom:18px}
          """
          s2 = s2.replace("</style>", CSS_FIX + "</style>", 1)

          BROWSE_BTN = '<button class="btn btn-red" id="browse-books" type="button">Browse the Bookshelf</button>'
          BOOKS_VIEW = """<section class="block slim books-view" id="books-view" aria-labelledby="books-view-heading">
            <div class="wrap">
              <button class="btn btn-red books-back" id="books-back" type="button">&larr; Back to the homepage</button>
              <h2 id="books-view-heading" tabindex="-1">Steve's bookshelf</h2>
              <p>The complete bookshelf — every book Steve recommends, and what he took from each one.</p>
              <div class="book-grid" id="bookGrid"></div>
              <div id="bookEmpty"></div>
            </div>
          </section>"""
          home_cur = books_section_of(s2)
          assert s2.count(home_cur) == 1, "books section must occur exactly once"
          assert "Steve's bookshelf" in home_cur and "Books Steve recommends" in home_cur, "books heading/intro missing"
          GRID_DIV = '<div class="book-grid" id="bookGrid"></div>'
          EMPTY_DIV = '<div id="bookEmpty"></div>'
          assert home_cur.count(GRID_DIV) == 1 and home_cur.count(EMPTY_DIV) == 1, "book grid/empty divs missing from the books section"
          home_new = home_cur.replace(GRID_DIV, "", 1).replace(EMPTY_DIV, "", 1)
          INTRO_P = "<p>Books Steve recommends — and what he took from each one.</p>"
          assert home_new.count(INTRO_P) == 1, "books intro paragraph must occur exactly once"
          home_new = home_new.replace(INTRO_P, INTRO_P + "\n  " + BROWSE_BTN, 1)
          print("homepage books section now shows only the browse button")
          s2 = s2.replace(home_cur, home_new + "\n" + BOOKS_VIEW, 1)

          assert s2.count("</body>") == 1, "expected exactly one </body>"
          TOGGLE_SCRIPT = """<script>
            // Books view toggle (Nov 10): the browse button opens the full books view; Back returns home.
            (function(){
              var openBtn = document.getElementById('browse-books');
              var backBtn = document.getElementById('books-back');
              var heading = document.getElementById('books-view-heading');
              function openBooks(){
                document.body.classList.add('books-open');
                window.scrollTo(0,0);
                if(heading){ heading.focus({preventScroll:true}); }
              }
              function closeBooks(){
                document.body.classList.remove('books-open');
                var home = document.getElementById('books');
                if(home){ home.scrollIntoView(); }
              }
              if(openBtn){ openBtn.addEventListener('click', openBooks); }
              if(backBtn){ backBtn.addEventListener('click', closeBooks); }
              document.querySelectorAll('a[href^="#"]').forEach(function(a){
                a.addEventListener('click', function(){ document.body.classList.remove('books-open'); });
              });
            })();
          </script>"""
          s2 = s2.replace("</body>", TOGGLE_SCRIPT + "\n</body>", 1)

          check(s2, "<figure", 3, "homepage figures after patch")
          check(s2, "<figcaption>405 lb back squat</figcaption>", 1, "hero caption after patch")
          check(s2, "<figcaption>255 lb clean</figcaption>", 1, "training banner caption after patch")
          check(s2, "<figcaption>185 lb snatch</figcaption>", 1, "about caption after patch")
          check(s2, "figure.hero-photo, figure.media{margin-inline:auto", 1, "figure centering rule")
          check(s2, "figure.hero-photo figcaption, figure.media figcaption{text-align:center}", 1, "caption centering rule")
          check(s2, "Start Training on TrainHeroic", 3, "TrainHeroic buttons after patch")
          assert "$30" in s2 and "$15" in s2, "prices changed"
          assert "identity.netlify.com" in s2 and "netlifyIdentity" in s2, "Netlify Identity wiring changed"
          assert "</html>" in s2, "closing html tag missing"
          assert "Welcome to Strength Speed Steve" in s2, "first blog post missing"
          assert "Speed Training 101" in s2, "second blog post missing"
          assert 'fetch("posts.json"' in s2 and 'fetch("books.json"' in s2, "book/blog loader changed"
          check(s2, "Browse the Bookshelf", 1, "browse button")
          check(s2, "The complete bookshelf", 1, "books view intro")
          check(s2, 'id="books-view"', 1, "books view section")
          check(s2, 'id="books-back"', 1, "back button")
          check(s2, 'id="bookGrid"', 1, "book grid after patch")
          check(s2, 'id="bookEmpty"', 1, "book empty after patch")
          check(s2, 'id="browse-books"', 1, "browse button id")
          check(s2, 'id="books-view-heading"', 1, "books view heading id")
          check(s2, "#books-view{display:none}", 1, "books view hidden rule")
          check(s2, "body.books-open #books-view{display:block}", 1, "books view open rule")
          check(s2, "body.books-open main>section:not(#books-view){display:none}", 1, "books view hide-home rule")
          check(s2, "body.books-open footer{display:none}", 1, "books view hide-footer rule")
          check(s2, ".books-back{margin-bottom:18px}", 1, "back button spacing rule")
          assert "getElementById('browse-books')" in s2, "browse button wiring missing"
          assert "getElementById('books-back')" in s2, "back button wiring missing"
          assert "getElementById('books-view-heading')" in s2, "books view heading wiring missing"
          assert "classList.add('books-open')" in s2, "books view open wiring missing"
          assert "classList.remove('books-open')" in s2, "books view close wiring missing"
          check(s2, "</style>", 1, "closing style tag after patch")
          check(s2, "</body>", 1, "closing body tag after patch")
          home = books_section_of(s2)
          assert "Steve's bookshelf" in home and "Books Steve recommends" in home, "books heading/intro missing after patch"
          assert "Browse the Bookshelf" in home, "browse button missing from the books section"
          assert 'id="bookGrid"' not in home, "book grid still inside the homepage books section"
          assert 'id="bookEmpty"' not in home, "book empty still inside the homepage books section"
          for b in canonical:
              assert b["title"] not in home, "book title still in the homepage books section: " + b["title"]
          view = books_view_of(s2)
          assert 'id="bookGrid"' in view, "book grid missing from the books view"
          assert 'id="bookEmpty"' in view, "book empty missing from the books view"
          assert "Back to the homepage" in view, "back control missing from the books view"
          assert "The complete bookshelf" in view, "books view intro missing from the books view"
          embedded2, _x, _y = parse_book_array(s2, find_book_marker(s2))
          assert [(b["title"], b["author"]) for b in embedded2] == [(b["title"], b["author"]) for b in canonical], "embedded book list after patch is not the canonical 33"
          books_after = json.loads(books_out)
          assert len(books_after["books"]) == 33, "books.json must have exactly 33 entries"
          assert [(b["title"], b["author"]) for b in books_after["books"]] == [(b["title"], b["author"]) for b in canonical], "books.json after patch is not the canonical 33"

          html_p.write_text(s2, encoding="utf-8")
          books_p.write_text(books_out, encoding="utf-8")
          print("PATCH OK: figures centered, books view added, 33 books verified, prices and TrainHeroic buttons untouched")
          PY
      - name: Commit patch
        run: |
          git config user.name "steven-rose34"
          git config user.email "steven-rose34@users.noreply.github.com"
          git add index.html books.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Center homepage figures and captions; move books list into a dedicated books view"
          git push
