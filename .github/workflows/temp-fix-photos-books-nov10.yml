name: Temp fix photos and books Nov 10
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch photos and books
        run: |
          python3 - <<'PY'
          import json, pathlib, re

          html_p = pathlib.Path("index.html")
          books_p = pathlib.Path("books.json")
          posts_p = pathlib.Path("posts.json")
          assert html_p.exists(), "index.html missing - refusing to proceed"
          assert books_p.exists(), "books.json missing - refusing to proceed"
          assert posts_p.exists(), "posts.json missing - refusing to proceed"
          s = html_p.read_text(encoding="utf-8")
          books_txt = books_p.read_text(encoding="utf-8")

          BOOKS_33 = [
              ("How to Win Friends and Influence People", "Dale Carnegie"),
              ("Confessions of an Economic Hit Man (3rd Edition)", "John Perkins"),
              ("Never Split the Difference", "Chris Voss"),
              ("The Fourth Turning", "William Strauss & Neil Howe"),
              ("The Fourth Turning Is Here", "Neil Howe"),
              ("The Intelligent Investor", "Benjamin Graham"),
              ("The Sovereign Individual", "James Dale Davidson & William Rees-Mogg"),
              ("Do Hard Things", "Steve Magness"),
              ("Spark", "John J. Ratey"),
              ("Broken Money", "Lyn Alden"),
              ("The Other Wes Moore", "Wes Moore"),
              ("Basic Economics (5th Edition)", "Thomas Sowell"),
              ("The Richest Man in Babylon", "George S. Clason"),
              ("1984", "George Orwell"),
              ("Animal Farm", "George Orwell"),
              ("Think Big and Kick Ass in Business and Life", "Donald J. Trump & Bill Zanker"),
              ("The 4-Hour Workweek", "Timothy Ferriss"),
              ("Outlive", "Peter Attia"),
              ("Can't Hurt Me", "David Goggins"),
              ("Never Finished", "David Goggins"),
              ("Conscious Coaching", "Brett Bartholomew"),
              ("12 Rules for Life", "Jordan B. Peterson"),
              ("Dopamine Nation", "Anna Lembke"),
              ("Chop Wood Carry Water", "Joshua Medcalf"),
              ("Alone at Dawn", "Dan Schilling"),
              ("The Story of Civilization I", "Will Durant"),
              ("The Story of Civilization II", "Will Durant"),
              ("The Story of Civilization III", "Will Durant"),
              ("The Story of Civilization IV", "Will Durant"),
              ("The Psychology of Money", "Morgan Housel"),
              ("Cancel Me If You Can", "Dave Portnoy"),
              ("Elon Musk", "Walter Isaacson"),
              ("Endurance", "Alfred Lansing"),
          ]
          assert len(BOOKS_33) == 33, "seed book list must have exactly 33 entries"
          SEED = [{"title": t, "author": a, "note": ""} for t, a in BOOKS_33]

          def check(text, sub, n, label):
              c = text.count(sub)
              assert c == n, f"{label}: expected {n}, found {c}"

          def array_span(text, marker_idx):
              start = text.index("[", marker_idx)
              depth = 0
              quote = None
              esc = False
              i = start
              while i < len(text):
                  ch = text[i]
                  if quote:
                      if esc:
                          esc = False
                      elif ch == "\\":
                          esc = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch in ("'", '"', "`"):
                          quote = ch
                      elif ch == "[":
                          depth += 1
                      elif ch == "]":
                          depth -= 1
                          if depth == 0:
                              return start, i
                  i += 1
              raise AssertionError("array end not found")

          def parse_book_array(text, marker_idx):
              a, b = array_span(text, marker_idx)
              raw = text[a:b + 1]
              lines = [ln for ln in raw.splitlines() if not ln.strip().startswith("//")]
              return json.loads("\n".join(lines))

          def books_section_of(text):
              i = text.index('id="books"')
              o = text.rfind("<section", 0, i)
              c = text.index("</section>", o) + len("</section>")
              return text[o:c]

          def find_book_marker(text):
              found = []
              for pat in (r"var BOOKS\s*=", r"const FALLBACK_BOOKS\s*="):
                  m = re.search(pat, text)
                  if m:
                      found.append(m)
              assert len(found) == 1, "embedded book array marker must appear exactly once"
              return found[0]

          def norm_books(lst):
              out = []
              for b in lst:
                  if not isinstance(b, dict):
                      raise AssertionError("book entries must be objects")
                  out.append({"title": b.get("title"), "author": b.get("author"), "note": b.get("note", "")})
              return out

          check(s, "Start Training on TrainHeroic", 3, "TrainHeroic buttons")
          assert "$30" in s, "price $30 missing"
          assert "$15" in s, "price $15 missing"
          assert "identity.netlify.com" in s, "Netlify Identity wiring missing"
          assert "netlifyIdentity" in s, "Netlify Identity wiring missing"
          assert "</html>" in s, "closing html tag missing"
          check(s, "</style>", 1, "style close tag")
          check(s, "</body>", 1, "body close tag")
          check(s, "<figure", 3, "homepage figures")
          check(s, "405 LB BACK SQUAT", 1, "hero caption")
          check(s, "255 LB CLEAN", 1, "training banner caption")
          check(s, "185 LB SNATCH", 1, "about caption")
          check(s, 'id="books"', 1, "books section id")
          assert s.count("Steve's bookshelf") in (1, 2), "books heading count wrong"
          check(s, "Books Steve recommends", 1, "books intro")
          check(s, 'id="book-list"', 1, "book list container")
          assert "Welcome to Strength Speed Steve" in s, "blog post 1 missing"
          assert "Speed Training 101" in s, "blog post 2 missing"
          assert 'fetch("posts.json"' in s, "blog loader missing"
          assert 'fetch("books.json"' in s, "books loader missing"

          marker = find_book_marker(s)
          embedded = parse_book_array(s, marker.start())
          assert isinstance(embedded, list), "embedded books must be a list"
          if embedded and len(embedded) != 33:
              raise AssertionError(f"embedded books: expected 0 or 33, found {len(embedded)}")
          books_data = json.loads(books_txt)
          assert isinstance(books_data, dict) and isinstance(books_data.get("books"), list), "books.json must hold a books list"
          json_books = books_data["books"]
          if json_books and len(json_books) != 33:
              raise AssertionError(f"books.json: expected 0 or 33, found {len(json_books)}")
          seeded = False
          if len(json_books) == 33:
              canonical = json_books
              if embedded and [b.get("title") for b in embedded] != [b.get("title") for b in canonical]:
                  raise AssertionError("embedded books and books.json disagree on titles")
              if embedded and [b.get("author") for b in embedded] != [b.get("author") for b in canonical]:
                  raise AssertionError("embedded books and books.json disagree on authors")
          elif len(embedded) == 33:
              canonical = embedded
          else:
              canonical = SEED
              seeded = True
              print("SEED: no 33-book data in the site yet; seeding the canonical 33-book list")
          assert len(canonical) == 33, "canonical book list must be 33"
          assert all(isinstance(b, dict) and b.get("title") and b.get("author") for b in canonical), "every book needs a title and author"
          assert len({b["title"] for b in canonical}) == 33, "book titles must be unique"
          if seeded:
              assert [b["title"] for b in canonical] == [t for t, a in BOOKS_33], "seeded titles wrong"
              assert [b["author"] for b in canonical] == [a for t, a in BOOKS_33], "seeded authors wrong"
          print("book data OK: 33 entries (seeded)" if seeded else "book data OK: 33 entries")

          home0 = books_section_of(s)
          for b in canonical:
              assert b["title"] not in home0, "book title in homepage books section before patch: " + b["title"]

          s2 = s
          books_json_out = json.dumps({"books": norm_books(canonical)}, ensure_ascii=False, indent=2) + "\n"

          if norm_books(embedded) != norm_books(canonical):
              mark2 = find_book_marker(s2)
              a, b = array_span(s2, mark2.start())
              s2 = s2[:a] + json.dumps(norm_books(canonical), ensure_ascii=False, indent=2) + s2[b + 1:]
              print("embedded book array updated to the 33 books")
          else:
              print("embedded book array already holds the 33 books")

          CSS_BLOCK = """
          /* Figure centering fix (Nov 10): every homepage photo/video figure is centered in its container at desktop and mobile widths, and each caption is centered under its media. */
          figure.hero-photo, figure.media { margin-inline: auto; width: 100%; max-width: 100%; }
          figure.hero-photo figcaption, figure.media figcaption { text-align: center; }
          /* Books view (Nov 10): separate full-page view, hidden until the browse button is clicked. */
          #books-view { display: none; }
          body.books-open #books-view { display: block; }
          body.books-open main > section:not(#books-view) { display: none; }
          body.books-open footer { display: none; }
          .books-back { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: 999px; border: 2px solid var(--ink); background: transparent; color: var(--ink); font-size: 15px; font-weight: 800; cursor: pointer; margin-bottom: 20px; }
          .books-back:hover { border-color: var(--accent); color: var(--accent); }
          """
          if "Figure centering fix (Nov 10)" not in s2:
              s2 = s2.replace("</style>", CSS_BLOCK + "</style>", 1)
              print("figure-centering and books-view CSS added")

          BROWSE_BTN = '<button class="btn btn-red" id="browse-books" type="button">Browse the Bookshelf</button>'
          m = re.search(r'<div[^>]*\bid="book-list"[^>]*>.*?</div>', s2, flags=re.S)
          assert m, "book-list div not found"
          book_list_div = m.group(0)
          assert all(b["title"] not in book_list_div for b in canonical), "a book title is inside the static book-list div"
          if 'id="browse-books"' not in s2:
              s2 = s2.replace(book_list_div, BROWSE_BTN, 1)
              print("homepage books section now shows only the browse button")
          if 'id="books-view"' not in s2:
              sec_i = s2.index('id="books"')
              sec_o = s2.rfind("<section", 0, sec_i)
              sec_c = s2.index("</section>", sec_o) + len("</section>")
              view = """
            <section class="section books-view" id="books-view" aria-labelledby="books-view-heading">
              <div class="wrap">
                <button class="btn books-back" id="books-back" type="button">&larr; Back to the homepage</button>
                <h2 id="books-view-heading" tabindex="-1">Steve's bookshelf</h2>
                <p class="section-intro">The complete bookshelf &mdash; every book Steve recommends, and what he took from each one.</p>
                __BOOK_LIST_DIV__
              </div>
            </section>"""
              view = view.replace("__BOOK_LIST_DIV__", book_list_div)
              s2 = s2[:sec_c] + view + s2[sec_c:]
              print("dedicated books view added after the books section")

          TOGGLE_JS = """
          <script>
          // Books view toggle (Nov 10): the browse button opens the full books view; Back returns home.
          (function () {
            var openBtn = document.getElementById('browse-books');
            var backBtn = document.getElementById('books-back');
            var home = document.getElementById('books');
            function openBooks() {
              document.body.classList.add('books-open');
              window.scrollTo(0, 0);
              var h = document.getElementById('books-view-heading');
              if (h) { try { h.focus({ preventScroll: true }); } catch (e) { h.focus(); } }
            }
            function closeBooks() {
              document.body.classList.remove('books-open');
              if (home) { home.scrollIntoView(); }
            }
            if (openBtn) { openBtn.addEventListener('click', openBooks); }
            if (backBtn) { backBtn.addEventListener('click', closeBooks); }
            Array.prototype.forEach.call(document.querySelectorAll('a[href="#books"]'), function (a) {
              a.addEventListener('click', function () { document.body.classList.remove('books-open'); });
            });
          })();
          </script>
          """
          if "Books view toggle (Nov 10)" not in s2:
              s2 = s2.replace("</body>", TOGGLE_JS + "</body>", 1)
              print("books view toggle script added")

          check(s2, "Start Training on TrainHeroic", 3, "TrainHeroic buttons after patch")
          assert "$30" in s2, "price $30 missing after patch"
          assert "$15" in s2, "price $15 missing after patch"
          assert "identity.netlify.com" in s2, "Netlify Identity wiring missing after patch"
          assert "netlifyIdentity" in s2, "Netlify Identity wiring missing after patch"
          assert "</html>" in s2, "closing html tag missing after patch"
          check(s2, "Figure centering fix (Nov 10)", 1, "centering CSS block")
          check(s2, "Books view toggle (Nov 10)", 1, "toggle script")
          check(s2, "<figure", 3, "homepage figures after patch")
          check(s2, "405 LB BACK SQUAT", 1, "hero caption after patch")
          check(s2, "255 LB CLEAN", 1, "training banner caption after patch")
          check(s2, "185 LB SNATCH", 1, "about caption after patch")
          check(s2, 'class="hero-photo"', 1, "hero figure after patch")
          check(s2, 'class="media training-media-wide"', 1, "training banner figure after patch")
          check(s2, "Browse the Bookshelf", 1, "browse button")
          check(s2, 'id="browse-books"', 1, "browse button id")
          check(s2, 'id="books-view"', 1, "books view section")
          check(s2, 'id="books-back"', 1, "books back button")
          check(s2, 'id="book-list"', 1, "book list container after patch")
          assert "books-open" in s2, "books view toggle wiring missing"
          assert 'fetch("posts.json"' in s2, "blog loader missing after patch"
          assert 'fetch("books.json"' in s2, "books loader missing after patch"
          assert "Welcome to Strength Speed Steve" in s2, "blog post 1 missing after patch"
          assert "Speed Training 101" in s2, "blog post 2 missing after patch"
          home = books_section_of(s2)
          assert "Steve's bookshelf" in home, "books heading missing after patch"
          assert "Books Steve recommends" in home, "books intro missing after patch"
          assert "Browse the Bookshelf" in home, "browse button missing from books section"
          assert 'id="book-list"' not in home, "book list still inside the homepage books section"
          for b in canonical:
              assert b["title"] not in home, "book title still in the homepage books section: " + b["title"]
          view_i = s2.index('id="books-view"')
          view_o = s2.rfind("<section", 0, view_i)
          view_c = s2.index("</section>", view_o) + len("</section>")
          view = s2[view_o:view_c]
          assert 'id="book-list"' in view, "book list missing from the books view"
          assert "Back to the homepage" in view, "back control missing from the books view"
          assert "Steve's bookshelf" in view, "books view heading missing"
          mark3 = find_book_marker(s2)
          embedded2 = parse_book_array(s2, mark3.start())
          assert len(embedded2) == 33, "embedded books must be 33 after patch"
          assert [b.get("title") for b in embedded2] == [b["title"] for b in canonical], "embedded titles wrong after patch"
          assert [b.get("author") for b in embedded2] == [b["author"] for b in canonical], "embedded authors wrong after patch"
          parsed_out = json.loads(books_json_out)
          assert parsed_out["books"] and len(parsed_out["books"]) == 33, "books.json must hold 33 entries"
          assert [b["title"] for b in parsed_out["books"]] == [b["title"] for b in canonical], "books.json titles wrong"
          assert [b["author"] for b in parsed_out["books"]] == [b["author"] for b in canonical], "books.json authors wrong"

          if s2 != s:
              html_p.write_text(s2, encoding="utf-8")
              print("patched index.html")
          else:
              print("index.html unchanged (already patched)")
          if books_txt != books_json_out:
              books_p.write_text(books_json_out, encoding="utf-8")
              print("patched books.json")
          else:
              print("books.json unchanged")
          print("PATCH OK: figures centered, books view added, 33 books verified, prices and TrainHeroic buttons untouched")
          PY
      - name: Commit patch
        run: |
          git config user.name "steven-rose34"
          git config user.email "steven-rose34@users.noreply.github.com"
          git add index.html books.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Center homepage figures and captions; move books list into a dedicated books view"
          git push
