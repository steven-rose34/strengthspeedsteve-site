name: Patch fonts
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update fonts in index.html
        run: |
          python3 - <<'PY'
          import re
          path = "index.html"
          text = open(path, encoding="utf-8").read()
          new_href = "https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
          link_tags = re.findall(r'<link[^>]*fonts\.googleapis\.com/css2[^>]*>', text)
          assert len(link_tags) == 1, f"expected exactly one Google Fonts css2 link tag, found {len(link_tags)}"
          text, n = re.subn(r'href="[^"]*fonts\.googleapis\.com/css2[^"]*"', 'href="' + new_href + '"', text, count=1)
          assert n == 1, "Google Fonts href replacement did not happen exactly once"
          old_serif = '--serif:"Source Serif 4",Georgia,serif'
          assert text.count(old_serif) == 1, f"--serif string appears {text.count(old_serif)} times, expected exactly once"
          text = text.replace(old_serif, '--serif:"Archivo","Inter",sans-serif')
          old_sans = '--sans:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif'
          assert text.count(old_sans) == 1, f"--sans string appears {text.count(old_sans)} times, expected exactly once"
          text = text.replace(old_sans, '--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif')
          old_weight = 'font-family:var(--serif);font-weight:600'
          count_weight = text.count(old_weight)
          assert count_weight >= 3, f"expected at least 3 occurrences of font-family:var(--serif);font-weight:600, found {count_weight}"
          text = text.replace(old_weight, 'font-family:var(--serif);font-weight:800')
          print(f"Replaced {count_weight} occurrences of font-family:var(--serif);font-weight:600")
          open(path, "w", encoding="utf-8").write(text)
          print("Font patch applied")
          PY
      - name: Commit and push index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update fonts to Archivo and Inter"
            git push
          fi
