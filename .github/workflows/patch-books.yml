name: Patch bookshelf view

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - << 'PY'
          import pathlib, sys
          path = pathlib.Path("index.html")
          text = path.read_text(encoding="utf-8")
          old_a = "</style>"
          new_a = """.book-grid{display:grid;gap:0}
          @media(min-width:860px){.book-grid{grid-template-columns:1fr 1fr;column-gap:44px}}
          .book-item{padding:13px 2px;border-bottom:1px solid var(--line)}
          .book-item h3{font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.25;margin:0 0 3px}
          .book-item .book-author{font-size:12px}
          .book-item .book-note{font-size:14px;margin-top:5px}
          </style>"""
          old_b = """    BOOKS.forEach(function(book){
                var card = document.createElement("div");
                card.className = "book-card";
                var cover = document.createElement("div");
                cover.className = "book-cover";
                if(book.cover){
                  cover.classList.add("has-img");
                  var cimg = document.createElement("img");
                  cimg.src = book.cover;
                  cimg.alt = "Cover of " + book.title + " by " + book.author;
                  cover.appendChild(cimg);
                } else {
                  cover.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>';
                  var ct = document.createElement("span");
                  ct.className = "bc-title"; ct.textContent = book.title;
                  cover.appendChild(ct);
                }
                var bbody = document.createElement("div");
                bbody.className = "book-card-body";
                var author = document.createElement("p");
                author.className = "book-author"; author.textContent = book.author;
                var title = document.createElement("h3");
                title.textContent = book.title;
                var note = document.createElement("p");
                note.className = "book-note"; note.textContent = book.note;
                bbody.appendChild(author); bbody.appendChild(title); bbody.appendChild(note);
                card.appendChild(cover); card.appendChild(bbody);
                grid.appendChild(card);
              });"""
          new_b = """    BOOKS.forEach(function(book){
                var card = document.createElement("div");
                card.className = "book-item";
                var title = document.createElement("h3");
                title.textContent = book.title;
                card.appendChild(title);
                if(book.author){
                  var author = document.createElement("p");
                  author.className = "book-author"; author.textContent = book.author;
                  card.appendChild(author);
                }
                if(book.note){
                  var note = document.createElement("p");
                  note.className = "book-note"; note.textContent = book.note;
                  card.appendChild(note);
                }
                grid.appendChild(card);
              });"""
          old_c = "<p>The complete bookshelf — every book Steve recommends, and what he took from each one.</p>"
          new_c = "<p>The complete bookshelf — every book Steve recommends.</p>"
          edits = [("A", old_a, new_a), ("B", old_b, new_b), ("C", old_c, new_c)]
          for label, old, new in edits:
            count = text.count(old)
            if count != 1:
              print(f"FAIL edit {label}: expected exactly 1 occurrence, found {count}", file=sys.stderr)
              sys.exit(1)
            text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          print("Patched index.html: edits A, B and C applied")
          PY
      - name: Commit patched index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Make bookshelf view more condensed and cleaner"
            git push
          fi
