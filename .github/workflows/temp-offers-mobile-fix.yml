name: Temp offers mobile fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Training offers weights and mobile compaction
        run: |
          python3 - <<'PY'
          import pathlib, sys
          p = pathlib.Path("index.html")
          assert p.exists(), "index.html missing - refusing to proceed"
          s = p.read_text(encoding="utf-8")
          MARKER = "/* SSS offers weight-match + mobile compaction 2026-11-10 */"
          if MARKER in s:
              print("Patch already applied; nothing to do.")
              sys.exit(0)
          def check(text, sub, n, label):
              c = text.count(sub)
              assert c == n, f"{label}: expected {n}, found {c}"
          check(s, '<p class="offer-name">SSS COMPLETE · TrainHeroic</p>', 1, "SSS COMPLETE card")
          check(s, '<p class="offer-name">SSS TRAINING LOG · TrainHeroic</p>', 1, "SSS TRAINING LOG card")
          check(s, 'data-sss-training-log="1"', 1, "training-log card marker")
          check(s, "Start Training", 3, "Start Training buttons")
          check(s, "$30", 5, "price $30 occurrences")
          check(s, "$15", 1, "price $15 occurrences")
          assert ".price-big{font-size:46px;font-weight:900;line-height:1;margin:0}" in s, "price-big anchor missing"
          assert "section.block{padding:56px 0}" in s, "section-block padding anchor missing"
          assert ".offer-price{" not in s, "offer-price rule already exists - refusing to guess"
          assert ".offer-sub{" not in s, "offer-sub rule already exists - refusing to guess"
          assert ".included{" not in s, "included rule already exists - refusing to guess"
          assert "</style>" in s, "</style> anchor missing"
          block = """/* SSS offers weight-match + mobile compaction 2026-11-10 */
          .offer-card .offer-name,.offer-card-log .offer-name{font-weight:800}
          .offer-card .offer-badge,.offer-card-log .offer-badge{font-weight:800}
          .price-big,.offer-price{font-weight:800}
          .price-big span,.offer-price span{font-weight:400}
          .price-sub,.offer-sub{font-weight:400}
          .check-list li,.included li{font-weight:400}
          .check-list li::before,.included li::before{font-weight:900;color:var(--accent)}
          .offer-card .btn,.offer-card-log .btn{font-weight:800}
          .offer-price{font-size:46px;line-height:1;margin:0}
          .offer-price span{font-size:19px;color:var(--ink-soft)}
          .offer-sub{margin:6px 0 18px;color:var(--ink-soft);font-size:16px}
          .included{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:10px}
          .included li{display:flex;gap:10px;font-size:16.5px;align-items:flex-start}
          .included li::before{content:"✓";flex:none;font-size:17px;line-height:1.4}
          @media (max-width:859px){
          #training{padding-top:36px;padding-bottom:36px}
          #training .section-head{margin-bottom:16px}
          .offers-grid{gap:14px;margin-top:16px}
          .offer-card{padding:16px}
          .offer-card .offer-badge{top:-13px;right:14px}
          .price-big,.offer-price{font-size:38px}
          .price-sub,.offer-sub{margin-bottom:12px;font-size:15px;line-height:1.45}
          .check-list,.included{gap:7px;margin-bottom:16px}
          .check-list li,.included li{font-size:15px;line-height:1.45}
          .offer-micro{margin-top:10px}
          }
          """
          assert "font-weight:600" not in block, "new block must not contain 600"
          s = s.replace("</style>", block + "</style>", 1)
          check(s, '<p class="offer-name">SSS COMPLETE · TrainHeroic</p>', 1, "SSS COMPLETE card after patch")
          check(s, '<p class="offer-name">SSS TRAINING LOG · TrainHeroic</p>', 1, "SSS TRAINING LOG card after patch")
          check(s, 'data-sss-training-log="1"', 1, "training-log card marker after patch")
          check(s, "Start Training", 3, "Start Training buttons after patch")
          check(s, "$30", 5, "price $30 after patch")
          check(s, "$15", 1, "price $15 after patch")
          assert s.count(MARKER) == 1, "marker must appear exactly once"
          assert s.count("</style>") == 1, "style tag count changed"
          assert ".offer-price{font-size:46px" in s, "offer-price rule missing after patch"
          assert ".offer-sub{margin:6px 0 18px" in s, "offer-sub rule missing after patch"
          assert ".included{list-style:none" in s, "included rule missing after patch"
          assert "@media (max-width:859px){" in s, "mobile block missing after patch"
          assert ".offer-card{padding:16px}" in s, "mobile card padding missing after patch"
          p.write_text(s, encoding="utf-8")
          assert p.exists(), "index.html missing after write"
          print("patched index.html OK")
          PY
      - name: Commit patch
        run: |
          git config user.name "steven-rose34"
          git config user.email "steven-rose34@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Fix Training offers: match card font weights; compact stacked cards on mobile"
          git push
