name: Temp offers mobile fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose Training offers section in detail
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("index.html")
          lines = p.read_text(encoding="utf-8").splitlines()
          print("TOTAL LINES", len(lines))
          def show(a, b, title):
              print("=== " + title + " ===")
              for i in range(a, min(b, len(lines))):
                  print(i + 1, lines[i])
          show(99, 122, "OFFER CSS 100-122")
          show(181, 196, "OFFERS GRID CSS 182-196")
          show(250, 300, "TRAINING HTML 251-300")
          print("=== FONT-WEIGHT 600 LINES ===")
          for i, line in enumerate(lines, 1):
              if "font-weight:600" in line or "font-weight: 600" in line:
                  print(i, line.strip()[:250])
          print("=== STRONG LINES ===")
          for i, line in enumerate(lines, 1):
              if "<strong" in line:
                  print(i, line.strip()[:250])
          print("=== SECTION PADDING LINES ===")
          for i, line in enumerate(lines, 1):
              if ".section{" in line or ".section-head{" in line:
                  print(i, line.strip()[:250])
          print("DIAG2 DONE - no changes written")
          PY
      - name: Commit patch
        run: |
          git config user.name "steven-rose34"
          git config user.email "steven-rose34@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Fix Training offers: match card font weights; compact stacked cards on mobile"
          git push
