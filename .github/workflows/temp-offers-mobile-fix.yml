name: Temp offers mobile fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose current Training offers markup and CSS
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("index.html")
          s = p.read_text(encoding="utf-8")
          print("LEN", len(s))
          cands = ["SSS COMPLETE", "SSS Complete", "SSS TRAINING LOG", "SSS Training Log", "Start Training", "offer-card", "offer-card-log", "offer-card-featured", "offer-name", "offer-price", "offer-sub", "offer-list", "offer-tag", "offer-badge", "offer-cta", "offers-grid", "font-weight:600", "font-weight:700", "font-weight:800", "font-weight:400", "$30", "$15", "7 days free", "</style>", "860", "TrainHeroic"]
          for c in cands:
              print("COUNT", repr(c), "=", s.count(c))
          print("=== OFFER LINES ===")
          n = 0
          for i, line in enumerate(s.splitlines(), 1):
              if "offer" in line.lower():
                  n += 1
                  print(i, line.strip()[:400])
          print("TOTAL OFFER LINES", n)
          print("=== MEDIA 860 LINES ===")
          for i, line in enumerate(s.splitlines(), 1):
              if "860" in line or "max-width" in line:
                  print(i, line.strip()[:300])
          print("=== TRAINING SECTION ===")
          k = s.find('id="training"')
          print("training anchor index:", k)
          if k >= 0:
              print(s[k:k+7000])
          else:
              print("id=training NOT FOUND")
          print("DIAGNOSTIC DONE - no changes written")
          PY
      - name: Commit patch
        run: |
          git config user.name "steven-rose34"
          git config user.email "steven-rose34@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Fix Training offers: match card font weights; compact stacked cards on mobile"
          git push
